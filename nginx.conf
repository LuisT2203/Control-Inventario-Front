server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cabeceras de seguridad básicas (el TLS lo pone Cloudflare/Easypanel delante)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:" always;

  # SPA: todo lo que no sea archivo va al index
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Estáticos versionados: caché larga
  location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
