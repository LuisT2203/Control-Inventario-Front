<div class="pantalla noche">
  <app-fondo-estrellas></app-fondo-estrellas>
  <div class="tarjeta">
    <div class="marca">Inicio de Sesion</div>
    <h1>Bienvenida</h1>
    <p class="ayuda">Escribe tu usuario y clave para abrir las tiendas.</p>
    <label>Usuario
      <input [(ngModel)]="usuario" name="usuario" autocomplete="username" placeholder="Escribe tu usuario">
    </label>
    <label>Clave
      <input [(ngModel)]="clave" name="clave" type="password" autocomplete="current-password" placeholder="Escribe tu clave">
    </label>
    @if (error) {
      <div class="error">{{ error }}</div>
    }
    <button class="grande primario" (click)="entrar()" [disabled]="cargando">
      {{ cargando ? 'Entrando…' : 'Entrar' }}
    </button>
  </div>
</div>
